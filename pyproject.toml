[project]
name = "ledgerlens"
version = "0.1.0"
description = "Evidence-first accounting investigation workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.18,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "celery[redis]>=5.4,<6",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "ortools>=9.11,<10",
  "pgvector>=0.3,<1",
  "beautifulsoup4>=4.12,<5",
  "langgraph-checkpoint-sqlite>=3,<4",
  "opentelemetry-sdk==1.45.1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "hypothesis>=6,<7", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
