server {
    listen 80;
    server_name localhost;
    client_max_body_size 20m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host localhost;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
