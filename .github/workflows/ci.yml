name: checks
# Topic branches are checked through their pull request; pushes run only on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.11.28'}
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q -rs
      - run: uv run ruff check backend scripts datasets benchmarks
      - run: uv run python scripts/generate_contracts.py --check
      # Rule 0.2.0 changed source files the v5 plans fingerprint. Per ROOT_CAUSE_V5 the plans
      # no longer authorize new runs; they stay reproducible at the commit that froze them.
      - name: Reproduce the frozen v5 plans at their freezing commit without model calls
        run: |
          frozen=2d42f97e973122a1ec6d736eefbcb337eb2431e2
          git fetch --no-tags --depth=1 origin "$frozen"
          git worktree add --detach "$RUNNER_TEMP/v5-frozen" "$frozen"
          cd "$RUNNER_TEMP/v5-frozen"
          uv sync --frozen --python 3.12
          uv run python -m datasets.generate_v5 --output .local/datasets-v5
          for plan in smoke selective comparator; do
            uv run python scripts/run_root_cause_v5.py --dataset .local/datasets-v5 --plan "docs/root-cause-v5-plans/$plan.json"
          done
  # Opt-in checks that the default job skips: live PostgreSQL migrations and the
  # persistent pgvector index (same credentials as the local retrieval service),
  # plus the pinned Beancount evaluator. Any skip here fails the job.
  optional:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: retrieval, POSTGRES_PASSWORD: local-retrieval-only, POSTGRES_DB: retrieval}
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U retrieval" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIGRATION_POSTGRES_TESTS: '1'
      RETRIEVAL_INDEX_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.11.28'}
      - run: uv sync --frozen --python 3.12
      - run: uv pip install -r benchmarks/requirements-beancount.txt
      - run: >-
          .venv/bin/python -m pytest -q -rs --junitxml="$RUNNER_TEMP/optional.xml"
          backend/tests/test_migrations_postgres.py backend/tests/test_retrieval_index.py
          backend/tests/test_beancount_differential.py
      - name: Require that every optional check executed
        run: >-
          .venv/bin/python -c "import sys, xml.etree.ElementTree as ET;
          suites = list(ET.parse(sys.argv[1]).getroot().iter('testsuite'));
          counts = {k: sum(int(s.get(k, 0)) for s in suites) for k in ('tests', 'skipped')};
          print(counts); sys.exit(counts['skipped'] > 0 or counts['tests'] == 0)" "$RUNNER_TEMP/optional.xml"
  # Every installed Python distribution and frontend lock entry must match
  # docs/license-policy.json; ambiguous metadata needs recorded evidence.
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.11.28'}
      - run: uv sync --frozen --python 3.12
      - run: uv run python scripts/check_licenses.py
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
  # The README's Linux/macOS path, run literally: install, prepare the local
  # database, start both services, check them, stop only what the script started.
  quickstart-unix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.11.28'}
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cp .env.example .env
      - run: bash scripts/start-local.sh
      - run: |
          curl -fsS http://127.0.0.1:8000/api/v1/health | jq -e '.mode == "local" and .model_configured == false'
          curl -fsS -o /dev/null http://127.0.0.1:5188/
      - run: bash scripts/stop-local.sh && ! curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:8000/api/v1/health
      - if: failure()
        run: tail -n 50 runtime/*.log || true
  # The README's Windows path with the PowerShell launcher, then the full backend suite.
  quickstart-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.11.28'}
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - shell: pwsh
        run: |
          Copy-Item .env.example .env
          powershell -ExecutionPolicy Bypass -File scripts/start-local.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $health = Invoke-RestMethod http://127.0.0.1:8000/api/v1/health
          if ($health.mode -ne 'local' -or $health.model_configured) { throw 'unexpected health response' }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5188 | Out-Null
          powershell -ExecutionPolicy Bypass -File scripts/stop-local.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q -rs
      - name: Prepare a stopped synthetic Windows backup for a different runner
        shell: pwsh
        run: .venv\Scripts\python.exe scripts\validate_cross_host_restore.py prepare --output "$env:RUNNER_TEMP\cross-host-source"
      - uses: actions/upload-artifact@v7
        with:
          name: cross-host-synthetic-backup
          path: ${{ runner.temp }}/cross-host-source/bundle
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-host-source-evidence
          path: |
            ${{ runner.temp }}/cross-host-source/report.json
            ${{ runner.temp }}/cross-host-source/*-guard.json
            ${{ runner.temp }}/cross-host-source/*-server.log
          if-no-files-found: ignore
          retention-days: 30
  # This job receives the actual Windows backup. A new Linux runner must
  # restore it, retain the recorded business/checkpoint rows and serve its files.
  cross-host-restore:
    needs: quickstart-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ''
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.11.28'}
      - run: uv sync --frozen --python 3.12
      - uses: actions/download-artifact@v8
        with:
          name: cross-host-synthetic-backup
          path: ${{ runner.temp }}/cross-host-bundle
          digest-mismatch: error
      - name: Restore and check Windows data on Linux
        run: >-
          uv run python scripts/validate_cross_host_restore.py verify
          --bundle "$RUNNER_TEMP/cross-host-bundle" --output "$RUNNER_TEMP/cross-host-target"
      - name: Real process interruption and recovery
        run: uv run python scripts/validate_restored_run.py --output "$RUNNER_TEMP/recovery-crash"
      - name: Bounded concurrent HTTP checks and stopped restore
        run: >-
          uv run python scripts/validate_recovery_load.py
          --output "$RUNNER_TEMP/recovery-load" --seconds 120 --clients 2
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-host-recovery-evidence
          path: |
            ${{ runner.temp }}/cross-host-target/report.json
            ${{ runner.temp }}/cross-host-target/*-guard.json
            ${{ runner.temp }}/cross-host-target/*-server.log
            ${{ runner.temp }}/recovery-crash/report.json
            ${{ runner.temp }}/recovery-load/report.json
          if-no-files-found: warn
          retention-days: 30
  # The Compose stack a reviewer would start: build, wait for health, check the web
  # entry and its API proxy, then remove the containers and volumes.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build -d
      - run: |
          for _ in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/v1/health | jq -e '.mode == "celery" and .model_configured == false'
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS http://127.0.0.1:8080/api/v1/books | jq -e '. == []'
      - if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100
          docker compose down -v
  # Reproduce the local demo on a fresh machine: regenerate synthetic data, hold
  # the existing 480/30 rule-label contract, then drive an empty database through
  # the browser. No model key is present, so no paid request can be made.
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ''
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.11.28'}
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --frozen --python 3.12
      - run: npm ci
        working-directory: frontend
      - name: Regenerate synthetic data and hold the 480/30 rule contract
        run: |
          mkdir -p "$RUNNER_TEMP/reproduce"
          uv run python -m datasets.generate --output .local/datasets
          PYTHONPATH=backend:. uv run python -m benchmarks.evaluate --require-acceptance \
            > "$RUNNER_TEMP/reproduce/rule-benchmark.json"
          jq '{case_count, failures, exact_label_match_rate, model_calls, reference_cases}' \
            "$RUNNER_TEMP/reproduce/rule-benchmark.json"
      - name: Start API on an empty database and the web dev server
        run: |
          demo="$RUNNER_TEMP/demo-data"
          test ! -e "$demo" && mkdir "$demo"
          PYTHONPATH=backend:. DATA_DIR="$demo" DATABASE_URL="sqlite:///$demo/demo.sqlite" \
            nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/reproduce/api.log" 2>&1 &
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/api/v1/health \
            | tee "$RUNNER_TEMP/reproduce/health.json" | jq -e '.model_configured == false and .mode == "local"'
          curl -fsS http://127.0.0.1:8000/api/v1/books | jq -e '. == []'
          cd frontend
          API_PROXY_TARGET=http://127.0.0.1:8000 nohup node node_modules/vite/bin/vite.js --host 127.0.0.1 \
            --port 5188 --strictPort > "$RUNNER_TEMP/reproduce/web.log" 2>&1 &
          curl -fsS -o /dev/null --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:5188/
      - name: Browser end-to-end tests
        working-directory: frontend
        env:
          UI_URL: http://127.0.0.1:5188
          API_PROXY_TARGET: http://127.0.0.1:8000
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/reproduce/browser.json
        run: npx playwright test --reporter=list,json
      # Same build, second API in multi-user mode: preparer, reviewer and approver are
      # separate accounts created by the local CLI; passwords are CI-only throwaways.
      - name: Multi-user sign-off browser flow
        env:
          SIGNOFF_PASSWORD: ci-only-signoff-password
        run: |
          demo="$RUNNER_TEMP/demo-multi"
          test ! -e "$demo" && mkdir "$demo"
          export PYTHONPATH=backend:. DATA_DIR="$demo" DATABASE_URL="sqlite:///$demo/demo.sqlite" AUTH_MODE=multi_user
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/reproduce/api-multi.log" 2>&1 &
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:8001/api/v1/health > /dev/null
          for spec in "paul:Paul:preparer" "rita:Rita:reviewer approver" "amy:Amy:approver"; do
            IFS=: read -r name display roles <<< "$spec"
            LEDGERLENS_NEW_PASSWORD="$SIGNOFF_PASSWORD" uv run python -m app.manage_users create \
              --username "$name" --display-name "$display" --roles $roles
          done
          cd frontend
          API_PROXY_TARGET=http://127.0.0.1:8001 nohup node node_modules/vite/bin/vite.js --host 127.0.0.1 \
            --port 5189 --strictPort > "$RUNNER_TEMP/reproduce/web-multi.log" 2>&1 &
          curl -fsS -o /dev/null --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:5189/
          MULTI_USER_TESTS=1 UI_URL=http://127.0.0.1:5189 \
            PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/reproduce/browser-multi.json" \
            npx playwright test tests/signoff.spec.ts --reporter=list,json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproduce-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/reproduce
            runtime/frontend-test-results
