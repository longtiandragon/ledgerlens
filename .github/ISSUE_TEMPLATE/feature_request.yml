name: 功能建议
description: 提出新功能或改进现有流程
title: "[建议] "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 在什么复核场景下遇到了什么困难？谁会用到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 期望的输入、输出和界面行为
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: 对不变量的影响
      description: 是否涉及原账只读、快照固定、模型建议与事实分离、金额精度？如不确定请写“不确定”
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
